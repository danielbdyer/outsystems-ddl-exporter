# The nightly template bake — Azure DevOps (PROVING_SURFACE_DESIGN §5.2;
# plan slice C10, decision h). Lives in the ESTATE repository (imported from
# the estate kit); tracks the estate's trunk, which lives in Azure DevOps.
#
# What one run does: check out the estate (this repository) and a PINNED ref
# of the tooling monorepo, then run the one bake path both lanes share —
# scripts/twin-bake-template.sh — against the estate's twin root: converge
# the twin at the estate head, crossover-merge the per-environment evidence
# packs when the twin.json names them, mint, plant and assert the witness
# pass, hard-fail on any blocking fidelity-audit verdict, stamp the template
# identity, BACKUP WITH COMPRESSION, and publish the .bak + manifest to the
# Universal Packages feed (the durable channel get-template.ps1 pulls from),
# with a pipeline artifact as the per-run fallback.
#
# Owner prerequisites, once (CAPTURE_POINT_RUNBOOK.md carries the walkthrough):
#   1. A GitHub service connection able to read the tooling monorepo —
#      set its name in the `githubServiceConnection` parameter default.
#   2. An Azure Artifacts feed for the templates — set `feed` below.
#   3. The estate repository carries its twin root (twin.json + the shape
#      tier + merge inputs staged by the capture point) at `estateTwinRoot`.
#   4. Import this file as a pipeline; the first run's manifest is filed
#      into estate/toolchain.md per the runbook.
#
# The monorepo pin (`toolingRef`) is bumped deliberately — a reviewed edit
# here, or an explicit queue-time override; never a floating branch. The
# `toolSource` parameter is the post-peel seam (B6): once `twin` ships as a
# distributable dotnet tool, the swap is one parameter, not a rewrite.

parameters:
  - name: toolSource
    displayName: Where the twin tool comes from
    type: string
    default: monorepo
    values: [ monorepo, dotnetTool ]
  - name: toolingRef
    displayName: Tooling monorepo ref (tag or commit; bump deliberately)
    type: string
    default: refs/heads/main
  - name: githubServiceConnection
    displayName: GitHub service connection for the tooling checkout
    type: string
    default: github-outsystems-ddl-exporter
  - name: estateTwinRoot
    displayName: Estate-relative directory carrying twin.json
    type: string
    default: twin
  - name: lane
    displayName: Manifest lane label
    type: string
    default: estate-nightly
  - name: feed
    displayName: Azure Artifacts feed (project-scoped name or project/feed)
    type: string
    default: proving-templates
  - name: packageName
    displayName: Universal Packages package name
    type: string
    default: twin-template

schedules:
  - cron: "30 3 * * *"
    displayName: nightly template bake
    branches:
      include: [ main ]
    always: true

trigger:
  branches:
    include: [ main ]

resources:
  repositories:
    - repository: tooling
      type: github
      name: danielbdyer/outsystems-ddl-exporter
      ref: ${{ parameters.toolingRef }}
      endpoint: ${{ parameters.githubServiceConnection }}

pool:
  vmImage: ubuntu-latest

variables:
  # Estate checkout lands under s/<repo-name>; tooling under s/outsystems-ddl-exporter.
  toolingDir: $(Build.SourcesDirectory)/outsystems-ddl-exporter

jobs:
  - job: bake
    displayName: bake the template at the estate head
    timeoutInMinutes: 60
    steps:
      - checkout: self
        path: s/estate
      - ${{ if eq(parameters.toolSource, 'monorepo') }}:
          - checkout: tooling
            path: s/outsystems-ddl-exporter

          - task: UseDotNet@2
            displayName: dotnet (per the tooling global.json)
            inputs:
              packageType: sdk
              useGlobalJson: true
              workingDirectory: $(toolingDir)

          - bash: |
              set -euo pipefail
              TWIN_BAKE_LANE='${{ parameters.lane }}' \
                bash "$(toolingDir)/sidecar/projection/scripts/twin-bake-template.sh" \
                  "$(Build.SourcesDirectory)/estate/${{ parameters.estateTwinRoot }}"
            displayName: twin-bake-template.sh (converge, merge, mint, witness, audit, freeze)

      - ${{ if eq(parameters.toolSource, 'dotnetTool') }}:
          - bash: |
              echo "##vso[task.logissue type=error]toolSource=dotnetTool is the post-peel seam (plan B6): the twin dotnet tool is not published yet. Bake with toolSource=monorepo."
              exit 1
            displayName: toolSource=dotnetTool (not yet published — named refusal)

      - bash: |
          set -euo pipefail
          OUT="$(Build.SourcesDirectory)/estate/${{ parameters.estateTwinRoot }}/templates"
          TEMPLATE_BAK="$(ls -t "$OUT"/*.bak | head -1)"
          MANIFEST="${TEMPLATE_BAK%.bak}.manifest.json"
          [ -f "$MANIFEST" ] || { echo "no manifest beside $TEMPLATE_BAK"; exit 1; }
          STAGE="$(Build.ArtifactStagingDirectory)/template"
          mkdir -p "$STAGE"
          cp "$TEMPLATE_BAK" "$MANIFEST" "$STAGE/"
          # The Universal Packages version: date + build, unique per run.
          echo "##vso[task.setvariable variable=templateVersion]$(date -u +%Y.%m%d).$(Build.BuildId)"
          echo "staged: $(basename "$TEMPLATE_BAK") + manifest"
        displayName: stage the newest template + manifest

      - task: UniversalPackages@0
        displayName: publish to the Universal Packages feed
        inputs:
          command: publish
          publishDirectory: $(Build.ArtifactStagingDirectory)/template
          feedsToUsePublish: internal
          vstsFeedPublish: ${{ parameters.feed }}
          vstsFeedPackagePublish: ${{ parameters.packageName }}
          versionOption: custom
          versionPublish: $(templateVersion)
          packagePublishDescription: >
            Synthetic proving template baked at the estate head — see the
            bundled manifest for the commit, fingerprints, pins, evidence
            sources, witness outcome, and fidelity-audit margins.

      - task: PublishPipelineArtifact@1
        displayName: pipeline artifact (per-run fallback channel)
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/template
          artifact: twin-template
