# ssdt-agent bake — publish the proving substrate as a pulled artifact.
#
# Produces the fingerprint-versioned .bacpac + manifest that a developer machine
# consumes with `node ssdt-agent/scripts/bake.mjs restore` (sqlpackage is the
# consumer's whole toolchain — no F#, no monorepo, no container required there).
# The steps here mirror the locally proven sequence exactly: an engine endpoint,
# a Strict publish of the unedited project (schema + idempotent seed), an export.
# Docker appears below only because a hosted runner needs *an* engine; on the
# estate's pipeline the same two commands run against any reachable SQL Server.

name: ssdt-agent bake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sidecar/projection/ssdt-agent/proving-ground/**"
      - "sidecar/projection/ssdt-agent/scripts/prove.mjs"
      - "sidecar/projection/ssdt-agent/scripts/bake.mjs"
      - ".github/workflows/ssdt-agent-bake.yml"

jobs:
  bake:
    name: bake the proving substrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAKE_SQL_PASSWORD: "Bake@Strong1"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Bake@Strong1"
        ports:
          - 11533:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Bake@Strong1' -C -Q 'SELECT 1' || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install sqlpackage
        run: dotnet tool install --global microsoft.sqlpackage
      - name: Point bake at the runner's engine
        run: |
          cat > sidecar/projection/ssdt-agent/proving-ground/prove.config.json <<'EOF'
          {
            "project": "SampleCatalog.sqlproj",
            "build": "auto",
            "profiles": { "strict": "profiles/ProvingGround.Strict.publish.xml",
                          "permissive": "profiles/ProvingGround.Permissive.publish.xml" },
            "target": { "server": "localhost,11533", "database": "ProvingGround",
                        "user": "sa", "passwordEnv": "BAKE_SQL_PASSWORD" }
          }
          EOF
      - name: Bake the artifact
        working-directory: sidecar/projection/ssdt-agent/proving-ground
        run: node ../scripts/bake.mjs make
      - name: Publish the artifact
        uses: actions/upload-artifact@v4
        with:
          name: proving-substrate
          path: sidecar/projection/ssdt-agent/proving-ground/bin/bake/
          if-no-files-found: error
          retention-days: 30
