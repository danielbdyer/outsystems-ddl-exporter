# The engine's CI (V3_MILESTONES.md WP 0.7): the fast lane on both CI operating systems; the SQL lane on Ubuntu against
# SQL Server 2022 Express, installed natively and run as a process by ci/sql.sh up, and on Windows against LocalDB through
# ci/sql.ps1 up (DECISIONS.md, 2026-10-19: no container anywhere in v3); and the SQL lane again on Ubuntu with all outbound
# traffic denied once SQL Server is installed. No secrets: ci/sql.sh generates the SA password inside the job.
name: dbchange

on:
  push:
    branches: [main, claude/v3-build]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DACFX_TELEMETRY_OPTOUT: '1'

jobs:
  fast:
    name: fast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the clock
        shell: bash
        run: echo "DBCHANGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DbChange.sln --locked-mode
      - run: dotnet build DbChange.sln --no-restore
      # M0 exit 1: the fast tests, and with them the build tests, which run dotnet build or publish or start dbchange as a process. A test
      # host that runs one test for eight minutes is stopped and the test named, since the lane takes two and its job stops at fifteen.
      - run: dotnet test DbChange.sln --no-build --filter "Category=fast|Category=build" --blame-hang-timeout 8m --blame-hang-dump-type none
      - name: Publish the tool folder
        if: runner.os == 'Linux'
        run: bash ci/publish.sh
      - name: Publish the tool folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/publish.ps1
      - name: Build tests/Golden/classic-minimal against dist/dbchange
        shell: pwsh
        run: |
          $tool = Join-Path $PWD 'dist/dbchange'
          dotnet build tests/Golden/classic-minimal/ClassicMinimal.sqlproj -c Release -p:DacFxTelemetryEnabled=false `
            -p:NetCoreBuild=true "-p:NETCoreTargetsPath=$tool" "-p:SQLDBExtensionsRefPath=$tool" "-p:TargetFrameworkRootPath=$tool/refasm"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet dist/dbchange/dbchange.dll --version
      - name: Elapsed
        if: always()
        shell: bash
        run: echo "elapsed $(( $(date +%s) - DBCHANGE_JOB_START )) s"

  sql-ubuntu:
    name: sql (ubuntu-latest, SQL Server 2022 Express)
    runs-on: ubuntu-latest
    # 880 s in all on 28d6bd7 and 1,138 s on d9f9369, as wave 7 took the fixture lane from 213 tests to 383
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start the clock
        shell: bash
        run: echo "DBCHANGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DbChange.sln --locked-mode
      - run: dotnet build DbChange.sln --no-restore
      - name: SQL Server 2022 Express, installed and started
        run: bash ci/sql.sh up
      # WP 3.1's oracle: v2's read side, built from the archive with the SDK v2 pins, so Io.Tests' ReadSideTests compares v3's Schema.Of
      # with v2's catalog on every push; the other SQL lanes compare it with the committed facts this lane holds equal to v2's.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.314
      - name: v2's read side, built from the archive (WP 3.1's oracle)
        # The assignment alone, so a failed build fails the step under bash -e, where an echo of it would not.
        run: |
          program="$(bash ci/readside.sh)"
          echo "DBCHANGE_READSIDE=$program" >> "$GITHUB_ENV"
      - run: >-
          dotnet test DbChange.sln --no-build --filter "Category=fixture&Spike!=S4"
          --blame-hang-timeout 10m --blame-hang-dump-type none --logger "console;verbosity=normal"
      # Spike S4 (V3_MILESTONES.md §6): a copy of a 300-table schema created, published, backed up, restored and dropped, each step
      # timed. The test prints its "S4 |" line only under the detailed logger, and appends it to this job's summary.
      - name: Spike S4, the copy's timings
        run: dotnet test tests/Io.Tests/Io.Tests.csproj --no-build --filter "Spike=S4" --logger "console;verbosity=detailed"
      - if: always()
        run: bash ci/sql.sh down
      - name: Elapsed
        if: always()
        shell: bash
        run: echo "elapsed $(( $(date +%s) - DBCHANGE_JOB_START )) s"

  sql-windows:
    name: sql (windows-latest, LocalDB)
    runs-on: windows-latest
    # 667 s of the 20 minutes before S4 and the copy cache's tests; LocalDB on the four-core runner is the slowest local server, and its
    # fixture step ran past 28 minutes on 28d6bd7, ae9db10 and d9f9369 with no test hung for 10
    timeout-minutes: 60
    # No DBCHANGE_SQL and no ~/.dbchange/sql.env, so io/LocalServer chooses LocalDB itself, as on the team's laptops.
    steps:
      - uses: actions/checkout@v4
      - name: Start the clock
        shell: bash
        run: echo "DBCHANGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DbChange.sln --locked-mode
      - run: dotnet build DbChange.sln --no-restore
      - name: LocalDB's MSSQLLocalDB
        shell: pwsh
        run: ./ci/sql.ps1 up
      - run: >-
          dotnet test DbChange.sln --no-build --filter "Category=fixture&Spike!=S4"
          --blame-hang-timeout 10m --blame-hang-dump-type none --logger "console;verbosity=normal"
      # Spike S4 (V3_MILESTONES.md §6): a copy of a 300-table schema created, published, backed up, restored and dropped, each step
      # timed. The test prints its "S4 |" line only under the detailed logger, and appends it to this job's summary.
      - name: Spike S4, the copy's timings
        run: dotnet test tests/Io.Tests/Io.Tests.csproj --no-build --filter "Spike=S4" --logger "console;verbosity=detailed"
      - name: Elapsed
        if: always()
        shell: bash
        run: echo "elapsed $(( $(date +%s) - DBCHANGE_JOB_START )) s"

  sql-offline:
    name: sql, outbound denied (ubuntu-latest)
    runs-on: ubuntu-latest
    # 1,437 s on d9f9369
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start the clock
        shell: bash
        run: echo "DBCHANGE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The solution holds tests/DacFx162/, so its DacFx 162.5.57 graph is restored and built here, before the deny; the child
      # process the fixture tests start from its build reads no package and opens no connection beyond loopback.
      - run: dotnet restore DbChange.sln --locked-mode
      - run: dotnet build DbChange.sln --no-restore
      - name: SQL Server 2022 Express, installed and started (the last step allowed the network)
        run: bash ci/sql.sh up
      # The deny is scoped to a group the tests run under, because the runner itself must keep reporting to GitHub.
      # Loopback stays open: it carries the SQL port (127.0.0.1:11434, where sqlservr listens) and the test runner's
      # own socket to its test host. sqlservr runs as the mssql user, outside the group, and makes no connection the
      # tests need.
      - name: Deny all outbound traffic to the tests except loopback
        run: |
          sudo groupadd --system dbchange-offline
          for table in iptables ip6tables; do
            sudo "$table" -A OUTPUT -m owner --gid-owner dbchange-offline -o lo -j ACCEPT
            sudo "$table" -A OUTPUT -m owner --gid-owner dbchange-offline -j REJECT
          done
          # offline <command>: the command as this user, in the group the deny applies to and in no other
          sudo tee /usr/local/bin/offline > /dev/null <<EOF
          #!/bin/sh
          exec sudo setpriv --reuid=$(id -u) --regid=dbchange-offline --clear-groups \
            env PATH="$PATH" HOME="$HOME" DOTNET_ROOT="${DOTNET_ROOT:-}" DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 "\$@"
          EOF
          sudo chmod +x /usr/local/bin/offline
      - name: The deny holds
        run: |
          if offline curl -sS --max-time 10 https://api.nuget.org/v3/index.json > /dev/null; then
            echo "outbound traffic from the tests' group was not denied" >&2
            exit 1
          fi
      - name: Fixture tests, outbound denied
        # S4's timings are the sql-ubuntu job's to take, on the same server
        run: |
          offline dotnet test DbChange.sln --no-build --filter "Category=fixture&Spike!=S4" \
            --blame-hang-timeout 10m --blame-hang-dump-type none --logger "console;verbosity=normal"
      - if: always()
        run: bash ci/sql.sh down
      - name: Elapsed
        if: always()
        shell: bash
        run: echo "elapsed $(( $(date +%s) - DBCHANGE_JOB_START )) s"
