# ssdt-agent proof lane — the Twin-proven corpus stays proven.
#
# Runs the 41 SamplePr facts + the Twin view-loop regression against live SQL
# Server containers (the fixtures own their containers; DacFx drives the
# publishes — no sqlpackage needed). Debug configuration, mirroring
# scripts/twin-test.sh (the SamplePr classes do not compile under Release —
# FS3511; a known, separate cleanup).
#
# Triggers: nightly (the corpus cannot silently rot), on demand, and on any PR
# that touches the corpus, the op catalog, or the Twin itself. Tightening or
# loosening this trigger set is the operator's runner-budget call
# (ENABLEMENT_PROGRAM.md §6.2).

name: ssdt-agent proof lane

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "archive/v2/ssdt-agent/sample-prs/**"
      - "archive/v2/ssdt-agent/proving-ground/**"
      - "archive/v2/src/Twin.Core/**"
      - "archive/v2/src/Twin.Runtime/**"
      - "archive/v2/src/Twin.Cli/**"
      - "archive/v2/tests/Twin.Tests.Integration/**"
      - ".github/workflows/ssdt-agent-proof-lane.yml"

jobs:
  twin-facts:
    name: the 41 SamplePr facts + the view-loop regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: archive/v2/global.json
      - name: Run the proof corpus (Debug, own containers)
        working-directory: archive/v2
        run: >
          dotnet test tests/Twin.Tests.Integration/Twin.Tests.Integration.fsproj
          --filter "FullyQualifiedName~SamplePr|FullyQualifiedName~TwinViewLoopTests"
          --logger "console;verbosity=minimal"
